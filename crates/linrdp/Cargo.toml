[package]
name = "linrdp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A simple Linux RDP client (early development)"
publish = false

[dependencies]
linrdp-proto = { path = "../linrdp-proto" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
ring = "0.17"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
sspi = { version = "0.21.3", default-features = false, features = ["ring"] }
zeroize = "1"
rpassword = "7"
der = { version = "0.7.10", features = ["derive", "std"] }
minifb = "0.28"
raw-window-handle = "0.6.2"

[dev-dependencies]
rcgen = "0.14"

[lints]
workspace = true
