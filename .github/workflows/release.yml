name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable build --workspace --release --locked
      - name: Bundle release
        shell: bash
        run: |
          set -euo pipefail
          archive="fjern-${GITHUB_REF_NAME}-x86_64-linux"
          install -Dm755 target/release/fjern "$archive/fjern"
          install -Dm644 contrib/fjern.desktop "$archive/fjern.desktop"
          install -Dm644 contrib/icons/fjern.svg "$archive/fjern.svg"
          install -Dm644 LICENSE "$archive/LICENSE"
          install -Dm644 README.md "$archive/README.md"
          tar --sort=name --mtime="UTC 1970-01-01" --owner=0 --group=0 --numeric-owner -czf "$archive.tar.gz" "$archive"
          sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fjern-${{ github.ref_name }}-x86_64-linux.tar.gz
            fjern-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256
          fail_on_unmatched_files: true
