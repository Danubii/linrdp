name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - name: Install XKB runtime for native keyboard regression
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0
      - run: cargo +stable test --manifest-path vendor/minifb/Cargo.toml --locked --lib fjern_
      - run: cargo +stable build --workspace --release --locked
